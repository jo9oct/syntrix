
name: CI

on:
  push:
    branches:
      - main
      - master
      - sentrix-core

  pull_request:
    branches:
      - main
      - master
      - sentrix-core

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend (Dependencies & Syntax)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate backend syntax and entrypoints
        run: |
          node --check server.js
          node --check worker.js
          node --check start.js

  frontend-ci:
    name: Frontend (Dependencies & Production Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend for production
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3001/api/v1

  docker-ci:
    name: Docker Configuration Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: |
          docker build \
            -t sentrix-backend:ci \
            -f backend/Dockerfile \
            backend/

      - name: Prepare Docker Compose environment
        run: |
          if [ -f backend/.env.example ] && [ ! -f backend/.env ]; then
            cp backend/.env.example backend/.env
          fi

      - name: Validate Docker Compose configuration
        run: docker compose -f backend/docker-compose.yml config
