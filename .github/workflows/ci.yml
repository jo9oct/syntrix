name: CI

on:
  push:
    branches:
      - main
      - master
      - sentrix-core
  pull_request:
    branches:
      - main
      - master
      - sentrix-core
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend (Syntax & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate syntax and entrypoints
        run: node --check server.js worker.js start.js

      - name: Run backend tests
        run: npm test
        env:
          CI: true
          NODE_ENV: test
          PORT: 3001
          JWT_SECRET: ci-test-jwt-secret-key-minimum-32-chars-long

  frontend-ci:
    name: Frontend (Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate build and TypeScript
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3001/api/v1

  docker-ci:
    name: Docker Configuration Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: docker build -t sentrix-backend:ci -f backend/Dockerfile backend/

      - name: Validate Docker Compose configuration
        run: |
          if [ -f backend/.env.example ] && [ ! -f backend/.env ]; then
            cp backend/.env.example backend/.env
          fi
          docker compose -f backend/docker-compose.yml config

