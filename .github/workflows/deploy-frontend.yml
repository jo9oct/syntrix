name: Deploy Frontend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Frontend Application
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 2

      - name: Check for frontend modifications
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Triggered manually via workflow_dispatch: Proceeding with deployment."
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git show --pretty="" --name-only HEAD)
            echo "Changed files in commit:"
            echo "$CHANGED_FILES"
            if echo "$CHANGED_FILES" | grep -q '^frontend/'; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              echo "Frontend changes detected: Proceeding with deployment."
            else
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "No frontend changes detected: Skipping deployment."
            fi
          fi

      - name: Setup Node.js 22.x
        if: steps.filter.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.should_deploy == 'true'
        run: npm --prefix frontend ci

      - name: Build production bundle
        if: steps.filter.outputs.should_deploy == 'true'
        run: npm --prefix frontend run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3001/api/v1' }}

      - name: Execute Frontend Deployment via Deploy Hook
        if: steps.filter.outputs.should_deploy == 'true' && env.HAS_DEPLOY_WEBHOOK == 'true'
        env:
          HAS_DEPLOY_WEBHOOK: ${{ secrets.FRONTEND_DEPLOY_WEBHOOK_URL != '' }}
          WEBHOOK_URL: ${{ secrets.FRONTEND_DEPLOY_WEBHOOK_URL }}
        run: |
          echo "Triggering frontend deployment webhook..."
          curl -sS -f -X POST "$WEBHOOK_URL"
          echo "Frontend deployment webhook triggered successfully."

      - name: Execute Frontend Deployment via SSH / Static Hosting
        if: steps.filter.outputs.should_deploy == 'true' && env.HAS_DEPLOY_WEBHOOK != 'true' && env.HAS_SSH == 'true'
        env:
          HAS_DEPLOY_WEBHOOK: ${{ secrets.FRONTEND_DEPLOY_WEBHOOK_URL != '' }}
          HAS_SSH: ${{ secrets.FRONTEND_HOST != '' && secrets.FRONTEND_SSH_KEY != '' }}
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}
          FRONTEND_USER: ${{ secrets.FRONTEND_USER || 'root' }}
          FRONTEND_SSH_KEY: ${{ secrets.FRONTEND_SSH_KEY }}
          FRONTEND_DEPLOY_PATH: ${{ secrets.FRONTEND_DEPLOY_PATH || '/var/www/html' }}
        run: |
          echo "Configuring SSH..."
          mkdir -p ~/.ssh
          echo "$FRONTEND_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$FRONTEND_HOST" >> ~/.ssh/known_hosts

          echo "Synchronizing production dist files..."
          scp -i ~/.ssh/deploy_key -r frontend/dist/* "$FRONTEND_USER@$FRONTEND_HOST:$FRONTEND_DEPLOY_PATH/"
          echo "Frontend assets deployed successfully."

      - name: Verify Deployment Configuration Status
        if: steps.filter.outputs.should_deploy == 'true' && env.HAS_DEPLOY_WEBHOOK != 'true' && env.HAS_SSH != 'true'
        env:
          HAS_DEPLOY_WEBHOOK: ${{ secrets.FRONTEND_DEPLOY_WEBHOOK_URL != '' }}
          HAS_SSH: ${{ secrets.FRONTEND_HOST != '' && secrets.FRONTEND_SSH_KEY != '' }}
        run: |
          echo "================================================================="
          echo "Frontend build completed and CI passed successfully!"
          echo "To activate automated deployment, configure one of the following in GitHub Secrets:"
          echo "  - Option 1 (Cloud / Vercel / Netlify / Render hook): Set FRONTEND_DEPLOY_WEBHOOK_URL"
          echo "  - Option 2 (VPS / Nginx / Web server): Set FRONTEND_HOST, FRONTEND_USER, and FRONTEND_SSH_KEY"
          echo "================================================================="

