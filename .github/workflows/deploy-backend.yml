name: Deploy Backend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend Service
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 2

      - name: Check for backend modifications
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Triggered manually via workflow_dispatch: Proceeding with deployment."
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git show --pretty="" --name-only HEAD)
            echo "Changed files in commit:"
            echo "$CHANGED_FILES"
            if echo "$CHANGED_FILES" | grep -q '^backend/'; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              echo "Backend changes detected: Proceeding with deployment."
            else
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "No backend changes detected: Skipping deployment."
            fi
          fi

      - name: Execute Backend Deployment via Deploy Hook
        if: steps.filter.outputs.should_deploy == 'true' && env.HAS_DEPLOY_WEBHOOK == 'true'
        env:
          HAS_DEPLOY_WEBHOOK: ${{ secrets.BACKEND_DEPLOY_WEBHOOK_URL != '' }}
          WEBHOOK_URL: ${{ secrets.BACKEND_DEPLOY_WEBHOOK_URL }}
        run: |
          echo "Triggering backend deployment webhook..."
          curl -sS -f -X POST "$WEBHOOK_URL"
          echo "Deployment webhook triggered successfully."

      - name: Execute Backend Deployment via SSH
        if: steps.filter.outputs.should_deploy == 'true' && env.HAS_DEPLOY_WEBHOOK != 'true' && env.HAS_SSH == 'true'
        env:
          HAS_DEPLOY_WEBHOOK: ${{ secrets.BACKEND_DEPLOY_WEBHOOK_URL != '' }}
          HAS_SSH: ${{ secrets.BACKEND_HOST != '' && secrets.BACKEND_SSH_KEY != '' }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
          BACKEND_USER: ${{ secrets.BACKEND_USER || 'root' }}
          BACKEND_SSH_KEY: ${{ secrets.BACKEND_SSH_KEY }}
          BACKEND_DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH || '/var/www/cyber-assessment' }}
        run: |
          echo "Configuring SSH..."
          mkdir -p ~/.ssh
          echo "$BACKEND_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$BACKEND_HOST" >> ~/.ssh/known_hosts

          echo "Executing remote deployment commands..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$BACKEND_USER@$BACKEND_HOST" << EOF
            set -e
            cd "$BACKEND_DEPLOY_PATH"
            git pull origin main || git pull origin master
            docker compose -f backend/docker-compose.yml up -d --build api worker
          EOF
          echo "Remote deployment completed successfully."

      - name: Verify Deployment Configuration Status
        if: steps.filter.outputs.should_deploy == 'true' && env.HAS_DEPLOY_WEBHOOK != 'true' && env.HAS_SSH != 'true'
        env:
          HAS_DEPLOY_WEBHOOK: ${{ secrets.BACKEND_DEPLOY_WEBHOOK_URL != '' }}
          HAS_SSH: ${{ secrets.BACKEND_HOST != '' && secrets.BACKEND_SSH_KEY != '' }}
        run: |
          echo "================================================================="
          echo "Backend changes detected and CI passed successfully!"
          echo "To activate automated deployment, configure one of the following in GitHub Secrets:"
          echo "  - Option 1 (PaaS / Cloud): Set BACKEND_DEPLOY_WEBHOOK_URL"
          echo "  - Option 2 (VPS / Docker): Set BACKEND_HOST, BACKEND_USER, and BACKEND_SSH_KEY"
          echo "================================================================="

