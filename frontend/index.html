<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentrix — Unified Autonomous Cybersecurity & Attack Surface Management Platform</title>
    <meta name="description" content="Sentrix is a modern autonomous cybersecurity operations platform providing comprehensive attack surface discovery, 25+ real-time vulnerability scanners, automated remediation triage, and continuous compliance monitoring." />
    <meta name="keywords" content="Sentrix, cybersecurity, vulnerability scanner, attack surface discovery, DAST, penetration testing, security operations, malware analysis, compliance" />
    <meta name="author" content="Sentrix Security" />
    <meta name="theme-color" content="#020617" />
    <meta name="application-name" content="Sentrix" />

    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sentrix" />
    <meta property="og:title" content="Sentrix — Unified Autonomous Cybersecurity & Attack Surface Management Platform" />
    <meta property="og:description" content="Sentrix is a modern autonomous cybersecurity operations platform providing comprehensive attack surface discovery, 25+ real-time vulnerability scanners, automated remediation triage, and continuous compliance monitoring." />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sentrix — Unified Autonomous Cybersecurity & Attack Surface Management Platform" />
    <meta name="twitter:description" content="Sentrix is a modern autonomous cybersecurity operations platform providing comprehensive attack surface discovery, 25+ real-time vulnerability scanners, automated remediation triage, and continuous compliance monitoring." />
    <meta name="twitter:image" content="/logo.png" />
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('runtime-error-overlay');
        if (!el) {
          el = document.createElement('div');
          el.id = 'runtime-error-overlay';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#030712;color:#ef4444;padding:32px;z-index:999999;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;white-space:pre-wrap;overflow:auto;';
          document.body.appendChild(el);
        }
        el.innerHTML += '<h2 style="color:#f87171;margin-top:0;">Runtime Client Error</h2>' +
          '<p><strong>Message:</strong> ' + e.message + '</p>' +
          '<p><strong>File:</strong> ' + e.filename + ':' + e.lineno + ':' + e.colno + '</p>' +
          '<pre style="background:rgba(255,255,255,0.05);padding:16px;border-radius:12px;color:#fca5a5;">' + (e.error ? e.error.stack : 'No stack trace available') + '</pre>' +
          '<button onclick="localStorage.removeItem(\'sentrix-auth\');location.reload();" style="margin-top:16px;padding:10px 20px;background:#ef4444;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">Clear Session & Reload</button><hr style="border-color:#374151;margin:24px 0;">';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('runtime-error-overlay');
        if (!el) {
          el = document.createElement('div');
          el.id = 'runtime-error-overlay';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#030712;color:#ef4444;padding:32px;z-index:999999;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;white-space:pre-wrap;overflow:auto;';
          document.body.appendChild(el);
        }
        var reason = e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'Unknown rejection';
        el.innerHTML += '<h2 style="color:#f87171;margin-top:0;">Unhandled Promise Rejection</h2>' +
          '<pre style="background:rgba(255,255,255,0.05);padding:16px;border-radius:12px;color:#fca5a5;">' + reason + '</pre>' +
          '<button onclick="localStorage.removeItem(\'sentrix-auth\');location.reload();" style="margin-top:16px;padding:10px 20px;background:#ef4444;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">Clear Session & Reload</button><hr style="border-color:#374151;margin:24px 0;">';
      });
    </script>
  </head>
  <body class="bg-[#020617] text-white" style="background-color: #020617; color: #f8fafc; margin: 0; min-height: 100vh;">
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;color:#06b6d4;gap:16px;">
        <img src="/logo.png" alt="Sentrix Logo" style="width:54px;height:54px;object-fit:contain;margin-bottom:8px;border-radius:12px;" />
        <div style="width:40px;height:40px;border:3px solid rgba(6,182,212,0.2);border-top-color:#06b6d4;border-radius:50%;animation:spin 1s linear infinite;"></div>
        <div style="font-weight:600;letter-spacing:0.05em;text-transform:uppercase;font-size:13px;color:#94a3b8;">Loading Sentrix Platform...</div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
